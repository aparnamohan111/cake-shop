
<!doctype html>
<html lang="en">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />
    </head>
  <style>
    img{
        width: 300px;
        height: 300px;
    }
    *{
          font-family:cursive
        }
        
        
  </style>
    <body>
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <h3 style="margin-left: 100PX;font-weight: bold;">CAKE WORLD</h3>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
            
            <ul class="navbar-nav ms-auto" style="font-size: 25px;gap: 25px;margin-right: 30px;">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{% url 'home' %}">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{% url 'cake_upld' %}">Add Cake</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{% url 'cakeview' %}">View Cake</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{% url 'viewcart' %}">Cart</a>
              </li>
            </ul>
            
          </div>
        </div>
      </nav>

        <div class="container mt-4">
            <div class="row">
                {% for i in data %}
                <div class="col-md-4">
                    <div class="card mb-4 shadow-sm">
                        <img src="{{ i.cimg.url }}" class="card-img-top" alt="{{ i.cname }}">
                        <div class="card-body text-center">
                            <h5 class="card-title">{{ i.cname }}</h5>
                            <p class="card-text fw-bold">Rs.{{ i.cprice }}</p>
                            <a href="/addtocart?idn={{i.id}}" class="btn btn-primary">ADD TO CART</a>
                            <form action="{% url 'send_cake_email' i.id %}" method="POST">
                              {% csrf_token %}
                              <label for="recipient_email">Enter Email:</label>
                              <input type="email" name="recipient_email" required>
                             <button type="submit" class="btn btn-outline-secondary">Send Cake Details</button>
                          </form>
                        </div>
                    </div>
                </div>
                {% empty %}
                
                {% endfor %}
            </div>
        </div>
        

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
