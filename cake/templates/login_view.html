
{% load static %}

<!doctype html>
<html lang="en">

    <head>
        <title>LOGIN</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />
    </head>

        <style>
           *{
          font-family:cursive
        }
              
            body{
                background: url('{% static "image/c7.jpg" %}');
                background-size: cover;
                background-repeat: no-repeat;
            }       
           
            .container {
                height: 350px;
                width: 100%;
                padding: 150px;
            }
           
            .form-container {
                justify-items: center;
                background:white;
                padding: 20px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
                border-radius: 8px;
                width: 400px;
            }

        </style>

    <body>

        <div class="container">
            <div class="form-container">
                <form method="post">
                    {% csrf_token %}
                    <h4 style="text-align: center;">LOGIN</h4>
                    <label for="email">Email ID:<span style="color: red;"Required>*</span></label><br>
                    <input type="email" id="name" name="email" placeholder="Enter your email-id "><br><br>
                    <label for="password">Password: <span style="color: red;"Required>*</span></label><br>
                    <input type="password" id="password" name="pass" placeholder="Enter Password"><br><br>
                    <button type="submit" style="background-color: rgb(152, 156, 152);">Submit</button>
                    <hr >
                    <p style="text-align: center;">OR</p>
                    <p style="text-align: center;">Don't have an account? <a href="{% url 'index' %}">Register here </a></p>
                </form>
            </div>
        </div>
        
         <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>

    </body>
</html>
