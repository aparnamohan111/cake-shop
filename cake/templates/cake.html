{% load static %}
<!doctype html>
<html lang="en">
    <head>
        <title>CAKE</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />
    </head>
    <style>
       *{
          font-family:cursive
        }
        body{
          background: url('{% static "image/c3.jpg" %}');
          background-size: cover;
          background-repeat: no-repeat;

        }
        .container {
        justify-items: center;
        height: 350px;
        width: 100%;
        padding: 100px;
    
}

.form-container {
    justify-items: center;
    background: white;
    padding: 20px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    border-radius: 8px;
    width: 400px;
}


    </style>
    <body>
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <h3 style="margin-left: 100PX;font-weight: bold;">CAKE WORLD</h3>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
            
            <ul class="navbar-nav ms-auto" style="font-size: 25px;gap: 25px;margin-right: 30px;">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{% url 'home' %}">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{% url 'cake_upld' %}">Add Cake</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{% url 'cakeview' %}">View Cake</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{% url 'viewcart' %}">Cart</a>
              </li>
            </ul>
            
          </div>
        </div>
      </nav>

        <div class="container">
            {{msg}}
            <div class="form-container">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <h4 style="text-align: center;">Cake Details</h4>

                    <label for="cake">cake image<span style="color: red;">*</span></label><br>
                    <input type="file" id="name" name="cimage" placeholder="cake image "><br><br>

                    <label for="name">Name<span style="color: red;">*</span></label><br>
                    <input type="name" id="name" name="cname" placeholder="Enter your name "><br><br>

        
                    <label for="price">Price <span style="color: red;">*</span></label><br>
                    <input type="price" id="price" name="cprice" placeholder="Enter price"><br><br>

        
                    <button type="submit" style="background-color: rgb(152, 156, 152);">Submit</button>
                    
                </form>
            </div>
        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
